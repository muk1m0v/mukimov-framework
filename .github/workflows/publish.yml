name: Publish to PyPI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
